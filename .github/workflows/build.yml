name: Build APK

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HardwareLens.apk

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: HardwareLens-apk
          path: HardwareLens.apk

      # Always-current download link: Releases -> "Latest build"
      # https://github.com/<owner>/<repo>/releases/download/latest/HardwareLens.apk
      - name: Publish to the "latest" release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build
          prerelease: true
          make_latest: false
          body: |
            Version 0.1.${{ github.run_number }} (versionCode ${{ github.run_number }}) — automatic build of `${{ github.ref_name }}` @ ${{ github.sha }}.
            Download **HardwareLens.apk** below, open it on your phone, and allow "Install unknown apps".
          files: HardwareLens.apk

      - name: Attach APK to a versioned release (when you push a tag like v0.1.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HardwareLens.apk
